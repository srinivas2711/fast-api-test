name: Build and deploy Python app to Azure Web App - fast-api-test

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Optional: test dependencies locally
      - name: Install dependencies locally (optional)
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install -r requirements.txt

      # Prepare artifact: flatten app/ folder and include requirements.txt
      - name: Prepare artifact
        run: |
          mkdir python-app
          cp -r app/* python-app/
          cp requirements.txt python-app/

      - name: Upload artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: python-app/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'fast-api-test'
          slot-name: 'staging'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_0EEDADA272F340049F1D75B4B96E00AF }}
          package: python-app/
